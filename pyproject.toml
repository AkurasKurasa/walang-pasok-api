[project]
name = "walang-pasok-api"
version = "0.1.0"
description = "Public API and website tracking class suspensions in the Philippines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "tzdata>=2024.1",  # zoneinfo data for Asia/Manila on Windows/slim images
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx2",  # used by Starlette's TestClient
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
