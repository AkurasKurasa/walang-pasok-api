# The whole service, on GitHub's machines. Every 15 minutes:
#
#   1. check the news sources and publish well-sourced suspensions (autopilot),
#      sending Discord/Facebook alerts and an admin summary;
#   2. rebuild the static website and JSON API from the database;
#   3. deploy it to GitHub Pages.
#
# Setup (repo Settings > Secrets and variables > Actions):
#   Secret   DATABASE_URL               your Neon (or other) Postgres URL  (required)
#   Secret   ADMIN_DISCORD_WEBHOOK_URL  optional: what was published, and what needs a person
#   Secrets  FACEBOOK_PAGE_ID, FACEBOOK_PAGE_ACCESS_TOKEN   optional: post to your Page
# and Settings > Pages > Source: "GitHub Actions".
#
# GitHub starts scheduled runs late when it's busy (sometimes by an hour or more)
# and turns schedules off in public repos after 60 days without commits.
# Run it now anytime: Actions > Update site > Run workflow.
name: Update site

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_watch:
        description: "Only rebuild the site (don't check the news)"
        type: boolean
        default: false
      load_examples:
        description: "Also load the real example suspensions (once, for the demo pages)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# One run at a time, so two runs never import the same article twice.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_DISCORD_WEBHOOK_URL: ${{ secrets.ADMIN_DISCORD_WEBHOOK_URL }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      STATIC_SITE_LINKS: "true"   # alerts link to /p/<place>/
      WATCHER_ENABLED: "false"    # this job runs the watcher itself
    steps:
      - name: Check settings
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add a DATABASE_URL secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - id: pages
        uses: actions/configure-pages@v5
      - name: Make sure the database is up to date
        run: alembic upgrade head
      # The watcher can only recognise places that are in the database.
      - name: Load the places (safe to repeat)
        run: python -m scripts.seed --locations-only
      - name: Load the real examples
        if: ${{ inputs.load_examples }}
        run: python -m scripts.seed
      - name: Check the news and publish
        if: ${{ !inputs.skip_watch }}
        env:
          PUBLIC_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python -m scripts.watch
      - name: Build the website and JSON API
        run: >
          python -m scripts.build_site --out _site
          --base "${{ steps.pages.outputs.base_path }}"
          --site-url "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
