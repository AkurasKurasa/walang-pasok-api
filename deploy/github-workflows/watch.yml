# Checks suspension news pages every 15 minutes and imports anything new as
# *pending*. New finds are posted to your admin Discord channel for review.
#
# Setup (repo Settings > Secrets and variables > Actions):
#   Secret   DATABASE_URL               your Neon (or other) Postgres URL
#   Secret   ADMIN_DISCORD_WEBHOOK_URL  optional: private channel for "new pending" reports
#   Variable SITE_URL                   optional: e.g. https://walang-pasok.onrender.com
#                                       (pinged each run so a free host never sleeps)
#
# GitHub may start scheduled runs a few minutes late when it's busy, and turns
# schedules off in public repos after 60 days without commits (re-enable in the
# Actions tab). Run it by hand anytime: Actions > Watch for class suspensions > Run workflow.
name: Watch for class suspensions

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      load_examples:
        description: "Also load the real example suspensions (once, for the demo pages)"
        type: boolean
        default: false

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_DISCORD_WEBHOOK_URL: ${{ secrets.ADMIN_DISCORD_WEBHOOK_URL }}
      PUBLIC_BASE_URL: ${{ vars.SITE_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check settings
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add a DATABASE_URL secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Make sure the database is up to date
        run: alembic upgrade head
      # The watcher can only recognise places that are in the database.
      - name: Load the places (safe to repeat)
        run: python -m scripts.seed --locations-only
      - name: Load the real examples
        if: ${{ inputs.load_examples }}
        run: python -m scripts.seed
      - name: Watch
        run: |
          if [ -n "$SITE_URL" ]; then
            python -m scripts.watch --ping "$SITE_URL"
          else
            python -m scripts.watch
          fi
